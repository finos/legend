name: Check Website Build

on:
  pull_request:
    branches:
      - "**"

jobs:
  build-website:
    name: Build Website
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v3.5.2
      - name: Checkout Legend Studio's user guides
        uses: actions/checkout@v3.5.2
        with:
          repository: finos/legend-studio
          path: website/external/legend-studio
          sparse-checkout: docs/user-guide
      - name: Setup Node
        uses: actions/setup-node@v3.6.0
        with:
          node-version: 21
      - name: Build Website
        working-directory: ./website
        run: |
          npm install
          npm run build
      - name: Search for Broken Links
        run: |
          node ./scripts/check-legend-application-documentation-broken-links.js
